name: capture-mlb

# Every 20 minutes from 15:00 to 05:59 UTC (covers every MLB first pitch).
# ~45 runs/day x ~1 billed minute = ~1,350 min/month: inside the 2,000 free
# minutes of a PRIVATE repo. GitHub may delay cron runs by several minutes;
# the decision windows in collect_snapshot.py are wide enough for that.
on:
  schedule:
    - cron: "*/20 15-23 * * *"
    - cron: "*/20 0-5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Capture schedule, lineups and (in windows) odds
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: eu
        run: python pipeline/collect_snapshot.py
      - name: Commit captures
        run: |
          git config user.name "capture-bot"
          git config user.email "capture-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "capture $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet && git push --quiet
